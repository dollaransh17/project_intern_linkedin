[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-lead-enrichment-agent"
version = "0.1.0"
description = "Browser-based, LLM-powered company lead enrichment."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.68,<3",
    "playwright>=1.50,<2",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
lead-enrich = "lead_enrichment.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
